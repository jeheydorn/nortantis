subMapDialog.step2.title=Crear sub-mapa \u2013 Nivel de detalle
subMapDialog.step2.advice=<html>Las formas terrestres del sub-mapa son aproximadas: cada sub-mapa usa una nueva cuadrícula de polígonos aleatoria, por lo que las costas pueden diferir ligeramente del original. Tras crear un sub-mapa, verifica que los iconos cerca de las costas no hayan desaparecido en el agua y que los ríos y caminos sigan las rutas esperadas.</html>
subMapDialog.step2.citiesOnWaterWarning={0} ciudades cerca de las costas en el mapa original no se dibujaron en el sub-mapa porque quedaron sobre el agua: {1}. Prueba una semilla diferente o un nivel de detalle diferente, o vuelve a añadir las ciudades faltantes a mano después de crear el sub-mapa.
subMapDialog.step2.cityOnWaterWarning=1 ciudad cerca de la costa en el mapa original no se dibujó en el sub-mapa porque quedó sobre el agua: {0}. Prueba una semilla diferente o un nivel de detalle diferente, o vuelve a añadir la ciudad faltante a mano después de crear el sub-mapa.
subMapDialog.step2.cityOnWaterListEntry=''{0}'' (grupo: {1}, Art Pack: {2})
subMapDialog.step2.matchSourceDetail=Igualar detalle de origen, colocación de iconos y colores, y ríos (\u2248{0} polígonos)
