subMapDialog.step2.choose=Elegir
subMapDialog.step2.chooseHelp=Establece manualmente el número de polígonos. Los iconos se redistribuyen en la nueva cuadrícula en lugar de copiarse directamente, por lo que pueden alejarse de las costas y las cordilleras. Los ríos se volverán a dibujar siguiendo la nueva cuadrícula.
subMapDialog.step2.numberOfPolygons.label=Nivel de detalle:
subMapDialog.step2.matchDetailDisabled=<html>"Igualar detalle de origen" no está disponible porque el área seleccionada es demasiado pequeña para generar el mínimo de {0} polígonos con el detalle de origen. Usa Elegir para establecer el número de polígonos manualmente.</html>
subMapDialog.step2.sliderDisplay={0}\u00d7, \u2248{1} polígonos
