exportTheme.sampleExplanation=Unten sehen Sie eine Beispielkarte mit diesem Design. Designs enthalten keine Landform, daher hat die Beispielkarte immer dasselbe Land. Die Einstellungen links legen fest, wie stark neue Zufallskarten mit diesem Design davon abweichen können. „Design würfeln“ zeichnet das Beispiel mit einer anderen Variation neu. Das Design selbst behält die Farben und Einstellungen Ihrer Karte; die Variationen der Beispielkarte werden nicht exportiert. Wird das Design mit {0} > {1} > {2} auf eine Karte angewendet, wird es genau so verwendet, wie es exportiert wurde, ohne Variation.
