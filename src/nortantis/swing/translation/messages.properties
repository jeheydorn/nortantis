customImages.folderStructureNote=The names above in angle brackets are folder and file names that you can configure to be whatever name you want. Folder names without angle brackets, however, must be exactly as described above or else Nortantis will ignore those folders. Images must be either PNG or JPG format. PNG is recommended because it supports transparency and isn''t lossy.
customImages.iconSizing=For icons (things drawn in the Icons tool), to control the size your images draw on your map, you can specify a width or height in the file name, such as width=&lt;number&gt; (or w&lt;number&gt; for short) or height=&lt;number&gt; (or h&lt;number&gt; for short). For example, an image named "large castle w28.png" will draw at 28 units wide (where a unit is a measurement based on the width of polygons in the map). Only width <em>or</em> height can be given, not both; that way scaling respects the aspect ratio. If you specify the size of just one image in a folder, then the others will be scaled proportionately to that one. Note that mountain and hill sizes vary based on the size of the polygons they are initially drawn on. Also, any icon can be resized on the map by editing it using the Icons tool, and the Effects tab has slider bars to resize all icons of a type.
customImages.borderImageNames=Valid border image names are ''upper_left_corner'', ''upper_right_corner'', ''lower_left_corner'', ''lower_right_corner'', ''top_edge'', ''bottom_edge'', ''left_edge'', ''right_edge''. At least one corner and one edge must be given. If corners are wider than the sides of edges, the corners will be inset into the map.
customImages.treeTypes=Regarding tree images, although the {0} folders can have any names, if you want new maps to use your tree types appropriately for the biomes the trees are placed in, then use folder names including the words ''cacti'', ''deciduous'', and ''pine''.
