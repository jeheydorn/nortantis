startup.linkDonate=Donate
# The supportAsk pieces below are concatenated, in the order listed, into one sentence, with
# donateLinkText and bookLinkText drawn as hyperlinks inside it. SupportPanel decides the spacing at
# each seam itself, so no piece should start or end with a space; afterBookLink leads with the
# sentence's period on purpose, and languages that need a word on the far side of a link (such as
# the German separable prefix in betweenLinks and afterBookLink) can put one there.
#
# Wording notes for translation:
#  - "clean" is a content rating, not a tone: no profanity, no sexual content, and violence that is
#    never graphic. The books are NOT lighthearted, so do not render it as light or breezy (pt
#    "leves", de "leicht", fr "légères", es "ligeras" all mislead). What is in use instead: de
#    "jugendfreie", es "sanas", fr "saines", pt "sadias", ru "добрые", zh "适合全年龄的".
#  - The books are rated 10+, so avoid any phrasing that claims suitability for small children. That
#    rules out pt "para todas as idades" and es "para todas las edades", which both mean no age
#    restriction at all. German "jugendfrei" is fine: it means suitable for youth, not for toddlers.
#  - Romance is a major thread and humor a minor one, hence "with romance and a touch of humor".
#    Keep the qualifier on humor and off romance rather than dropping or moving it.
#  - "please consider" is deliberately a soft ask rather than a request for money, so keep the hedge
#    (de "denken ... nach", es "considera", fr "pensez à", pt "considere", ru "подумайте о", zh
#    "请考虑") instead of reducing it to a direct "please donate". Languages that hedge less than
#    English still have an everyday way to say it; reach for that rather than for officialese.
startup.supportAsk.beforeDonateLink=If you have enjoyed Nortantis, please consider
startup.supportAsk.donateLinkText=donating
startup.supportAsk.betweenLinks=to support it. Or you can help by checking out our
startup.supportAsk.bookLinkText=books
startup.supportAsk.afterBookLink=. We write clean fantasy adventures with romance and a touch of humor.
